<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghoomte Raho</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <div class="wrapper">
        <div class="screens" id="screens">

            <!-- SPLASH -->
            <div class="screen splash" id="s0">
                
                <img class="splash-logo"
                   src="Ghoomte Raho.png" alt="Ghoomte Raho" />
                <div class="splash-title">Ghoomte Raho</div>
                <div class="splash-sub">— CHALO, KAHIN DOOR CHALTE HAIN —</div>
                <div class="splash-heading">Sign Up</div>
                <div class="splash-desc">Continue with Mail</div>
                <button class="btn-mail" onclick="goTo(1)">
                    <div class="btn-mail-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                    </div>
                    Continue with Mail
                </button>
                <button class="btn-guest" onclick="goTo(2)">Sign As Guest</button>
            </div>

            <!-- LOGIN -->
            <div class="screen auth-screen" id="s1">
                <div class="auth-header">
                    <button class="back-btn" onclick="goTo(0)"><svg width="15" height="15" viewBox="0 0 24 24"
                            fill="none" stroke="#1a4731" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M19 12H5M5 12l7 7M5 12l7-7" />
                        </svg></button>
                    <h1>Login</h1>
                </div>
                <div class="auth-body">
                    <div class="field-group">
                        <label>Email</label>
                        <input type="email" placeholder="hello@reallygreatsite.com" />
                    </div>
                    <div class="field-group">
                        <label>Password</label>
                        <input type="password" id="lpw" placeholder="••••••" />
                        <span class="field-icon" onclick="togglePw('lpw','lic')">
                            <svg id="lic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                <circle cx="12" cy="16" r="1" fill="currentColor" />
                            </svg>
                        </span>
                    </div>
                    <button class="btn-submit">login</button>
                    <div class="auth-footer">
                        Not have account?<br />
                        <span onclick="goTo(2)">Signup here</span>
                    </div>
                </div>
            </div>

            <!-- SIGNUP -->
            <div class="screen auth-screen" id="s2">
                <div class="auth-header">
                    <button class="back-btn" onclick="goTo(1)"><svg width="15" height="15" viewBox="0 0 24 24"
                            fill="none" stroke="#1a4731" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M19 12H5M5 12l7 7M5 12l7-7" />
                        </svg></button>
                    <h1>SignUp</h1>
                </div>
                <div class="auth-body">
                    <div class="field-group">
                        <label>Name</label>
                        <input type="text" placeholder="James Morgan" />
                    </div>
                    <div class="field-group">
                        <label>Email</label>
                        <input type="email" placeholder="hello@reallygreatsite.com" />
                    </div>
                    <div class="field-group">
                        <label>Password</label>
                        <input type="password" id="spw" placeholder="••••••" />
                        <span class="field-icon" onclick="togglePw('spw','sic')">
                            <svg id="sic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                <circle cx="12" cy="16" r="1" fill="currentColor" />
                            </svg>
                        </span>
                    </div>
                    <button class="btn-submit">SignUp</button>
                    <div class="auth-footer">
                        Already Registered?<br />
                        <span onclick="goTo(1)">Log in here.</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
